name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: naija_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/naija_test

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Push Database Schema
        run: pnpm exec drizzle-kit push

      - name: Seed Database Before Build
        run: |
          cat << 'EOF' > seed-ci.ts
          import { db } from "./lib/db";
          import { products, categories, variants, inventory } from "./lib/db/schema";
          async function seed() {
            await db.insert(categories).values({ id: "test-cat", name: "Playwright Category", slug: "playwright-category" }).onConflictDoNothing();
            await db.insert(products).values({ 
              id: "test-prod", 
              name: "Playwright Product", 
              slug: "playwright-product", 
              description: "Test product", 
              priceKobo: 50000, 
              categoryId: "test-cat"
            }).onConflictDoNothing();
            await db.insert(variants).values({ id: "test-var", productId: "test-prod", name: "Default Variant", sku: "TEST-SKU-001" }).onConflictDoNothing();
            await db.insert(inventory).values({ id: "test-inv", variantId: "test-var", quantity: 100 }).onConflictDoNothing();
            console.log("Database seeded successfully!");
            process.exit(0);
          }
          seed();
          EOF
          npx -y tsx seed-ci.ts

      - name: Build App
        run: pnpm build
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'super-secret-dummy-key-for-ci-testing-only-12345' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'dummy-key' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://dummy.supabase.co' }}
          BETTER_AUTH_URL: http://localhost:3001
          NEXT_PUBLIC_APP_URL: http://localhost:3001

      - name: Run E2E Tests (Playwright)
        run: pnpm exec playwright test
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'super-secret-dummy-key-for-ci-testing-only-12345' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'dummy-key' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://dummy.supabase.co' }}
          BETTER_AUTH_URL: http://localhost:3001
          NEXT_PUBLIC_APP_URL: http://localhost:3001