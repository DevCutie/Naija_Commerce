name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/testdb

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Biome Check
        run: pnpm biome ci

      - name: Run Unit Tests with Coverage
        run: pnpm vitest run --coverage

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Push Database Schema
        run: pnpm exec drizzle-kit push

      - name: Seed Database Before Build
        run: |
          cat << 'EOF' > seed-ci.ts
          import { db } from "./lib/db";
          import { products, categories, variants } from "./lib/db/schema";
          async function seed() {
            await db.insert(categories).values({ id: "test-cat", name: "Playwright Category", slug: "playwright-category" }).onConflictDoNothing();
            await db.insert(products).values({ id: "test-prod", name: "Playwright Product", slug: "playwright-product", description: "Test product", priceKobo: 50000, category_id: "test-cat" }).onConflictDoNothing();
            
            // Added name field to satisfy the NOT NULL constraint
            await db.insert(variants).values({ id: "test-var", productId: "test-prod", name: "Default Variant" }).onConflictDoNothing();
            
            console.log("Database seeded successfully!");
            process.exit(0);
          }
          seed();
          EOF
          npx -y tsx seed-ci.ts

      - name: Build App
        run: pnpm build
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          BETTER_AUTH_URL: http://localhost:3001
          NEXT_PUBLIC_APP_URL: http://localhost:3001

      - name: Run E2E Tests (Playwright)
        run: pnpm exec playwright test
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          BETTER_AUTH_URL: http://localhost:3001
          NEXT_PUBLIC_APP_URL: http://localhost:3001